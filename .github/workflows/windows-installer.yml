# Builds the Windows installer and tries it on a Windows machine (install, run, update, uninstall).
# To save Actions minutes it runs only when a release is published (GitHub → Releases → Draft a new
# release, or `gh release create v0.3.0 --generate-notes`), and attaches the .exe to that release.
# To try installer changes without a release, start it by hand (Actions → Windows installer → Run
# workflow, or `gh workflow run windows-installer.yml --ref <branch>`); the .exe is then a download
# on the run's page.
name: Windows installer

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install Inno Setup
        run: if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --no-progress -y }
      - name: Build the installer
        run: deploy\windows\installer\build.ps1
      - name: Try the installer
        run: .github\test-installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: HoudiniDeck-Setup
          path: dist-installer/HoudiniDeck-Setup-*.exe
          if-no-files-found: error

  release:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: HoudiniDeck-Setup
      - name: Attach the installer to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" HoudiniDeck-Setup-*.exe --repo "$GITHUB_REPOSITORY" --clobber
