# Builds the Windows installer and tries it on a Windows machine (install, run, update, uninstall).
# Every run keeps the .exe as a download on the run's page; a version tag (v0.1.0, …) also publishes
# it as a GitHub release.
name: Windows installer

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install Inno Setup
        run: if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --no-progress -y }
      - name: Build the installer
        run: deploy\windows\installer\build.ps1
      - name: Try the installer
        run: .github\test-installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: HoudiniDeck-Setup
          path: dist-installer/HoudiniDeck-Setup-*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: HoudiniDeck-Setup
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" HoudiniDeck-Setup-*.exe --repo "$GITHUB_REPOSITORY" --title "HoudiniDeck $GITHUB_REF_NAME" --generate-notes
